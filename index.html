<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flooderso – Webcam Tracker</title>
<style>
  html,body{margin:0;height:100%;background:#0a0b10;color:#cfd8ff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center;gap:8px}
  canvas{border-radius:12px;background:#111;box-shadow:0 0 40px #1d4ed855}
  #bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:0 8px;font-size:13px;align-items:center}
  button{background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px}
  button:disabled{opacity:.5}
  #status{font-size:12px;opacity:.8;text-align:center;padding:0 10px;max-width:640px}
  details{font-size:12px;text-align:center}
  #cam{position:fixed;right:10px;bottom:10px;width:150px;border-radius:8px;transform:scaleX(-1);opacity:.85;display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="bar">
    <button id="start">Kamera starten</button>
    <button id="calib" disabled>Neu kalibrieren</button>
    <label><input type="checkbox" id="mirror" checked> Spiegeln</label>
    <label><input type="checkbox" id="showcam"> Kamera-Vorschau</label>
  </div>
  <details>
    <summary>Falsch herum? Hier korrigieren</summary>
    <label><input type="checkbox" id="invYaw"> Links/Rechts</label>
    <label><input type="checkbox" id="invPitch"> Hoch/Runter</label>
    <label><input type="checkbox" id="invRoll"> Neigung</label>
    <label><input type="checkbox" id="swapSides"> Linkes/rechtes Auge vertauscht</label>
  </details>
  <div id="status">Klicke auf „Kamera starten“. Ohne Kamera läuft eine Idle-Animation.</div>
</div>
<video id="cam" playsinline muted></video>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d"), statusEl = $("status"), video = $("cam");
const W = 1254, K = 1.5;

/* ====================== Hilfsfunktionen ====================== */
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function off(){ const o = document.createElement("canvas"); o.width = o.height = W * K; const c = o.getContext("2d"); c.scale(K, K); return [o, c]; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (cur, tgt, rate, dt) => cur + (tgt - cur) * (1 - Math.exp(-rate * dt));
const BLUE = "#1f6bff";

function brushText(c, txt, x, y, size, rot){
  c.save(); c.translate(x, y); c.rotate(rot); c.transform(1, 0, -0.22, 1, 0, 0);
  c.font = `900 ${size}px "Arial Black","Segoe UI",Impact,sans-serif`; c.textAlign = "center"; c.textBaseline = "middle";
  c.lineJoin = "round"; c.lineWidth = size * 0.12; c.strokeStyle = "#04102e"; c.strokeText(txt, 0, 0);
  const w = c.measureText(txt).width;
  const g = c.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, "#64b8ff"); g.addColorStop(1, "#1252e0");
  c.fillStyle = g; c.fillText(txt, 0, 0);
  c.beginPath(); c.moveTo(-w * 0.5, size * 0.62); c.quadraticCurveTo(0, size * 0.5, w * 0.52, size * 0.38);
  c.quadraticCurveTo(0, size * 0.66, -w * 0.5, size * 0.72); c.closePath(); c.fillStyle = "#2b86ff"; c.fill();
  c.restore();
}

/* ====================== Statische Ebenen ====================== */
const [bgC, bg] = off();
const [hoodC, hood] = off();
const [torsoC, tor] = off();

function chairPath(c){
  c.beginPath(); c.moveTo(30, 1254);
  c.bezierCurveTo(10, 1000, 10, 800, 40, 640);
  c.bezierCurveTo(80, 520, 180, 460, 250, 330);
  c.bezierCurveTo(290, 200, 330, 90, 470, 70);
  c.bezierCurveTo(560, 55, 700, 55, 790, 70);
  c.bezierCurveTo(920, 90, 960, 200, 1000, 330);
  c.bezierCurveTo(1070, 460, 1170, 520, 1210, 640);
  c.bezierCurveTo(1240, 800, 1240, 1000, 1224, 1254);
  c.closePath();
}

(function renderStatic(){
  const t = 62;
  for (let y = -1; y < W / t + 1; y++) for (let x = -1; x < W / t + 1; x++) {
    bg.fillStyle = (x + y) & 1 ? "#1c1c22" : "#131318"; bg.fillRect(x * t, y * t, t, t);
  }
  const rg = bg.createRadialGradient(627, 560, 80, 627, 560, 820);
  rg.addColorStop(0, "rgba(20,80,230,.30)"); rg.addColorStop(1, "rgba(0,0,0,0)");
  bg.fillStyle = rg; bg.fillRect(0, 0, W, W);

  bg.save(); bg.shadowColor = BLUE; bg.shadowBlur = 50; bg.fillStyle = "#0a0a0f"; bg.strokeStyle = BLUE; bg.lineWidth = 9;
  chairPath(bg); bg.fill(); bg.stroke(); bg.restore();
  bg.save(); bg.strokeStyle = "#050507"; bg.lineWidth = 6; chairPath(bg); bg.stroke(); bg.restore();

  for (const m of [1, -1]) {
    bg.save(); if (m < 0) { bg.translate(W, 0); bg.scale(-1, 1); }
    bg.shadowColor = BLUE; bg.shadowBlur = 22; bg.strokeStyle = "#1b62ee"; bg.lineWidth = 32; bg.lineCap = "round";
    bg.beginPath(); bg.moveTo(262, 400); bg.bezierCurveTo(205, 520, 85, 560, 56, 690); bg.bezierCurveTo(36, 800, 100, 950, 168, 1060); bg.stroke();
    bg.shadowBlur = 0; bg.strokeStyle = "#4b92ff"; bg.lineWidth = 6;
    bg.beginPath(); bg.moveTo(256, 410); bg.bezierCurveTo(200, 524, 82, 566, 54, 694); bg.stroke();
    bg.strokeStyle = "#0a0a0f"; bg.lineWidth = 8;
    bg.beginPath(); bg.moveTo(300, 420); bg.bezierCurveTo(240, 540, 130, 580, 100, 700); bg.stroke();
    bg.restore();
  }
  bg.save(); bg.shadowColor = BLUE; bg.shadowBlur = 14; bg.strokeStyle = "#1f6bff"; bg.lineWidth = 5; bg.lineCap = "round";
  bg.beginPath(); bg.moveTo(352, 330); bg.bezierCurveTo(378, 170, 470, 105, 627, 102); bg.bezierCurveTo(784, 105, 876, 170, 902, 330); bg.stroke();
  bg.restore();
  brushText(bg, "Flooderso", 622, 150, 78, -0.05);

  hood.fillStyle = "#0d0d11"; hood.beginPath(); hood.ellipse(627, 855, 335, 125, 0, 0, Math.PI * 2); hood.fill();
  hood.strokeStyle = "#2a2a33"; hood.lineWidth = 5; hood.stroke();
  hood.strokeStyle = "#050506"; hood.lineWidth = 3; hood.beginPath(); hood.ellipse(627, 860, 300, 100, 0, Math.PI * 1.05, Math.PI * 1.95); hood.stroke();

  const body = () => {
    tor.beginPath(); tor.moveTo(-10, 1254); tor.lineTo(-10, 1080);
    tor.bezierCurveTo(60, 990, 200, 950, 310, 918); tor.bezierCurveTo(400, 892, 480, 868, 545, 862);
    tor.lineTo(627, 946); tor.lineTo(709, 862);
    tor.bezierCurveTo(774, 868, 854, 892, 944, 918); tor.bezierCurveTo(1054, 950, 1194, 990, 1264, 1080);
    tor.lineTo(1264, 1254); tor.closePath();
  };
  body(); tor.fillStyle = "#0a0a0c"; tor.fill();
  tor.save(); body(); tor.clip();
  tor.strokeStyle = "#1d1d24"; tor.lineWidth = 6; tor.lineCap = "round";
  for (const d of [[300, 1000, 190, 1230], [380, 1060, 330, 1250], [950, 1000, 1070, 1230], [880, 1070, 930, 1250], [150, 1060, 60, 1160]]) {
    tor.beginPath(); tor.moveTo(d[0], d[1]); tor.quadraticCurveTo((d[0] + d[2]) / 2 + 20, (d[1] + d[3]) / 2, d[2], d[3]); tor.stroke();
  }
  tor.strokeStyle = "#2a2a33"; tor.lineWidth = 4;
  tor.beginPath(); tor.moveTo(-10, 1080); tor.bezierCurveTo(60, 990, 200, 950, 310, 918); tor.bezierCurveTo(400, 892, 480, 868, 545, 862); tor.lineTo(627, 946); tor.lineTo(709, 862);
  tor.bezierCurveTo(774, 868, 854, 892, 944, 918); tor.bezierCurveTo(1054, 950, 1194, 990, 1264, 1080); tor.stroke();
  brushText(tor, "Flooderso", 828, 1098, 54, -0.1);
  tor.restore();
})();

/* ====================== Zustand ====================== */
const KEYS = ["yaw","pitch","roll","hx","hy","bl","br","brow","gx","gy","open","fun","puck","sl","sr","frown","str","press","up","low","side"];
const T = {}, S = {};
KEYS.forEach(k => { T[k] = 0; S[k] = 0; });
let prev = { hx:0, hy:0, yaw:0, pitch:0, roll:0 };
let nextBlink = 2, blinkT = -1;
const str = { x:0, vx:0 };

/* ====================== Körper ====================== */
function drawBody(breath){
  ctx.save();
  const lean = S.hx * 0.35, lift = breath * 4 - S.hy * 0.25;
  ctx.translate(lean, -lift);
  ctx.translate(627, 1254); ctx.scale(1 + 0.012 * breath, 1 + 0.02 * breath); ctx.translate(-627, -1254);
  ctx.translate(627, 1150); ctx.rotate(S.roll * 0.045); ctx.translate(-627, -1150);

  ctx.drawImage(hoodC, 0, 0, W, W);
  ctx.fillStyle = "#e7a974"; ctx.beginPath();
  ctx.moveTo(565, 740); ctx.lineTo(690, 740); ctx.lineTo(706, 880); ctx.lineTo(627, 950); ctx.lineTo(548, 880); ctx.closePath(); ctx.fill();
  const ns = ctx.createRadialGradient(627, 830, 10, 627, 850, 120); ns.addColorStop(0, "rgba(120,60,30,.55)"); ns.addColorStop(1, "rgba(120,60,30,0)");
  ctx.fillStyle = ns; ctx.fillRect(500, 760, 254, 190);
  ctx.drawImage(torsoC, 0, 0, W, W);

  for (const [x0, x1, sw] of [[545, 538, 1], [718, 724, 1.15]]) {
    const ex = x1 + str.x * sw, cx = x0 + str.x * 0.35 * sw;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#3a3a44"; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(x0, 950); ctx.quadraticCurveTo(cx, 1070, ex, 1182); ctx.stroke();
    ctx.strokeStyle = "#07070a"; ctx.lineWidth = 9; ctx.stroke();
    ctx.fillStyle = "#4d4d58"; rr(ctx, ex - 7, 1178, 14, 40, 5); ctx.fill();
    ctx.fillStyle = "#2a2a31"; ctx.beginPath(); ctx.arc(x0, 944, 13, 0, 7); ctx.fill();
    ctx.fillStyle = "#050506"; ctx.beginPath(); ctx.arc(x0, 944, 7, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ====================== Kopfhörer ====================== */
function drawCupLeft(c, sc){
  c.save(); c.translate(363, 0); c.scale(sc, 1); c.translate(-363, 0);
  rr(c, 272, 512, 172, 262, 62); c.fillStyle = "#0d0d11"; c.fill(); c.strokeStyle = "#323a58"; c.lineWidth = 3; c.stroke();
  rr(c, 326, 530, 32, 228, 16); c.fillStyle = "#2370ff"; c.fill();
  rr(c, 332, 536, 8, 216, 4); c.fillStyle = "#6aa9ff"; c.fill();
  rr(c, 372, 548, 10, 192, 5); c.fillStyle = "#1a4fc2"; c.fill();
  c.fillStyle = "#1a1a1f"; c.beginPath(); c.ellipse(434, 645, 22, 112, 0, 0, 7); c.fill();
  c.strokeStyle = "#07070a"; c.lineWidth = 4; c.stroke();
  c.strokeStyle = "#2a2a31"; c.lineWidth = 2;
  for (let i = 0; i < 16; i++) { const yy = 548 + i * 13; c.beginPath(); c.moveTo(424, yy); c.lineTo(442 + (i & 1) * 4, yy + 5); c.stroke(); }
  c.restore();
}

/* ====================== Haare (jede Strähne mit eigener Feder) ====================== */
// [Spitze x,y | Basis links x,y | Basis rechts x,y | Gewicht | Ebene]
const LOCKS = [
  // Ebene 0: äußere Spitzen
  [312,306, 372,430, 392,330, 1.0, 0], [346,236, 392,350, 450,270, 1.0, 0], [432,206, 450,290, 520,232, 1.0, 0],
  [560,188, 520,250, 610,215, 1.0, 0], [690,184, 640,235, 740,220, 1.0, 0], [806,206, 740,230, 830,290, 1.0, 0],
  [894,246, 820,290, 880,360, 1.0, 0], [944,312, 870,370, 905,440, 1.0, 0],
  // Ebene 1: Oberkopf
  [415,232, 380,330, 470,270, .8, 1], [500,196, 450,280, 550,250, .9, 1], [590,205, 540,260, 640,240, .7, 1],
  [672,190, 620,250, 720,240, .9, 1], [770,200, 710,250, 810,270, .9, 1], [838,236, 780,290, 862,330, .8, 1],
  [906,352, 850,320, 900,430, 1, 1], [936,388, 880,400, 918,478, 1, 1],
  [310,384, 372,358, 352,452, 1, 1], [298,428, 352,430, 346,506, 1, 1], [332,474, 360,486, 384,540, .8, 1],
  // Ebene 2: Pony
  [372,504, 380,440, 420,470, .6, 2], [448,540, 430,440, 496,456, .7, 2], [504,520, 470,440, 540,452, .7, 2],
  [558,498, 520,440, 592,450, .7, 2], [620,486, 585,440, 652,448, .7, 2], [678,476, 640,440, 708,448, .7, 2],
  [732,506, 690,440, 772,452, .7, 2], [792,532, 750,440, 832,462, .7, 2], [852,516, 820,450, 878,490, .6, 2],
  // Ebene 3: Koteletten
  [458,596, 450,480, 484,500, .55, 3], [796,596, 770,500, 804,480, .55, 3]
];
const LK = LOCKS.map(a => ({ a, x:0, vx:0, y:0, vy:0, k: 70 + Math.random() * 70, c: 3.8 + Math.random() * 2.6, ph: Math.random() * 6.28, f: .7 + Math.random() * .7 }));
const hairAvg = { x:0, y:0 };

function lockPath(c, x0, y0, x1, y1, ax, ay){
  const d1x = ax - x0, d1y = ay - y0, d2x = ax - x1, d2y = ay - y1;
  c.beginPath(); c.moveTo(x0, y0);
  c.quadraticCurveTo(x0 + d1x * .5 + d1y * .16, y0 + d1y * .5 - d1x * .16, ax, ay);
  c.quadraticCurveTo(x1 + d2x * .5 - d2y * .16, y1 + d2y * .5 + d2x * .16, x1, y1);
  c.closePath();
}
function drawLock(c, lk){
  const [tx, ty, x0, y0, x1, y1, w] = lk.a;
  const ax = tx + lk.x * w, ay = ty + lk.y * w;
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  lockPath(c, x0, y0, x1, y1, ax, ay);
  const g = c.createLinearGradient(mx, my, ax, ay);
  g.addColorStop(0, "#e2b25a"); g.addColorStop(.35, "#f3d287"); g.addColorStop(.8, "#f6dc99"); g.addColorStop(1, "#e3b660");
  c.fillStyle = g; c.fill();
  c.lineJoin = "round"; c.lineWidth = 2.4; c.strokeStyle = "rgba(120,82,28,.85)"; c.stroke();
  // Lichtreflex
  lockPath(c, mx + (x0 - mx) * .25, my + (y0 - my) * .25 - 2, mx + (x1 - mx) * .05, my + (y1 - my) * .05, mx + (ax - mx) * .8, my + (ay - my) * .8);
  c.fillStyle = "rgba(255,245,200,.55)"; c.fill();
  // Strähnenlinie
  c.strokeStyle = "rgba(190,140,55,.55)"; c.lineWidth = 2.4; c.beginPath();
  c.moveTo(mx + (x1 - mx) * .4, my + (y1 - my) * .4); c.lineTo(mx + (ax - mx) * .75 + (x1 - mx) * .1, my + (ay - my) * .75 + (y1 - my) * .1); c.stroke();
}
function drawLayer(c, n){ for (const lk of LK) if (lk.a[7] === n) drawLock(c, lk); }

function drawHairFront(c){
  drawLayer(c, 0);
  // Haarkappe
  c.beginPath(); c.moveTo(335, 520);
  c.bezierCurveTo(300, 380, 380, 230, 520, 205); c.bezierCurveTo(640, 180, 800, 215, 880, 330);
  c.bezierCurveTo(930, 400, 925, 480, 905, 540); c.lineTo(852, 500); c.lineTo(800, 468);
  c.bezierCurveTo(740, 448, 520, 440, 455, 470); c.lineTo(400, 500); c.closePath();
  const g = c.createLinearGradient(0, 200, 0, 520); g.addColorStop(0, "#f5d890"); g.addColorStop(.6, "#eecb7a"); g.addColorStop(1, "#dfae58");
  c.fillStyle = g; c.fill(); c.lineWidth = 3; c.strokeStyle = "rgba(120,82,28,.9)"; c.stroke();
  drawLayer(c, 1);
  // Glanzstreifen (schwingen leicht mit)
  c.save(); c.translate(hairAvg.x * .3, hairAvg.y * .3);
  c.lineCap = "round"; c.strokeStyle = "rgba(255,247,210,.6)"; c.lineWidth = 12;
  c.beginPath(); c.moveTo(470, 340); c.quadraticCurveTo(540, 272, 625, 272); c.stroke();
  c.lineWidth = 8; c.beginPath(); c.moveTo(700, 285); c.quadraticCurveTo(770, 290, 818, 335); c.stroke();
  c.strokeStyle = "rgba(200,150,60,.5)"; c.lineWidth = 6;
  c.beginPath(); c.moveTo(420, 400); c.quadraticCurveTo(470, 360, 520, 380); c.stroke();
  c.beginPath(); c.moveTo(740, 395); c.quadraticCurveTo(800, 370, 850, 410); c.stroke();
  c.restore();
  drawLayer(c, 2);
  drawLayer(c, 3);
}

/* ====================== Augen (vollständiges Schließen) ====================== */
function drawEye(c, cx, cy, cl, gx, gy, dir){
  const upMid = cy - 60 + cl * 76, upEnd = cy - 26 + cl * 36;
  const loMid = cy + 58 - cl * 42, loEnd = cy + 28 - cl * 18;
  const uq = 2 * upMid - upEnd, lq = 2 * loMid - loEnd;
  if (cl < .98) {
    c.save();
    c.beginPath(); c.ellipse(cx, cy + 2, 63, 57, 0, 0, Math.PI * 2); c.clip();
    c.beginPath(); c.moveTo(cx - 70, upEnd); c.quadraticCurveTo(cx, uq, cx + 70, upEnd);
    c.lineTo(cx + 70, loEnd); c.quadraticCurveTo(cx, lq, cx - 70, loEnd); c.closePath(); c.clip();
    c.fillStyle = "#f3f7ff"; c.fillRect(cx - 80, cy - 80, 160, 160);
    const sh0 = c.createLinearGradient(0, cy - 60, 0, cy - 20); sh0.addColorStop(0, "rgba(120,130,190,.45)"); sh0.addColorStop(1, "rgba(120,130,190,0)");
    c.fillStyle = sh0; c.fillRect(cx - 80, cy - 60, 160, 40);
    const ix = cx + gx * 13, iy = cy + 5 + gy * 10;
    const gr = c.createRadialGradient(ix, iy + 12, 6, ix, iy, 54); gr.addColorStop(0, "#74d0ff"); gr.addColorStop(.5, "#2e8cf2"); gr.addColorStop(1, "#0b3fb3");
    c.fillStyle = gr; c.beginPath(); c.arc(ix, iy, 51, 0, 7); c.fill(); c.strokeStyle = "#08255f"; c.lineWidth = 5; c.stroke();
    // Iris-Strahlen
    c.strokeStyle = "rgba(160,225,255,.35)"; c.lineWidth = 2;
    for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283; c.beginPath(); c.moveTo(ix + Math.cos(a) * 24, iy + Math.sin(a) * 24); c.lineTo(ix + Math.cos(a) * 46, iy + Math.sin(a) * 46); c.stroke(); }
    const sh = c.createLinearGradient(0, iy - 52, 0, iy + 6); sh.addColorStop(0, "rgba(4,18,80,.65)"); sh.addColorStop(1, "rgba(4,18,80,0)");
    c.fillStyle = sh; c.beginPath(); c.arc(ix, iy, 50, 0, 7); c.fill();
    c.fillStyle = "#081437"; c.beginPath(); c.arc(ix, iy + 2, 22, 0, 7); c.fill();
    c.fillStyle = "#fff"; c.beginPath(); c.arc(ix + 17, iy - 19, 13, 0, 7); c.fill();
    c.beginPath(); c.arc(ix - 19, iy + 22, 6.5, 0, 7); c.fill();
    c.globalAlpha = .8; c.beginPath(); c.arc(ix + 24, iy + 9, 3.5, 0, 7); c.fill();
    c.restore();
  }
  // Oberlid + Wimpern
  c.save(); c.strokeStyle = "#1a0f14"; c.lineCap = "round"; c.lineJoin = "round";
  c.lineWidth = 11 - cl * 3;
  c.beginPath(); c.moveTo(cx - 68, upEnd); c.quadraticCurveTo(cx, uq, cx + 68, upEnd); c.stroke();
  c.lineWidth = 7; c.beginPath(); c.moveTo(cx + dir * 66, upEnd - 1); c.lineTo(cx + dir * 86, upEnd - 12 + cl * 10); c.stroke();
  if (cl > .5) { // geschlossene Wimpern
    c.lineWidth = 3; c.strokeStyle = "rgba(26,15,20,.8)";
    for (let i = -2; i <= 2; i++) { const x = cx + i * 22, yy = upEnd + (upMid - upEnd) * (1 - (i / 3) * (i / 3)) * .5 + 4; c.beginPath(); c.moveTo(x, yy + 3); c.lineTo(x + i * 2, yy + 12); c.stroke(); }
  }
  if (cl < .6) { c.strokeStyle = "rgba(60,35,35,.6)"; c.lineWidth = 3; c.beginPath(); c.moveTo(cx - 60, loEnd - 6); c.quadraticCurveTo(cx, lq + 3, cx + 60, loEnd - 6); c.stroke(); }
  c.restore();
}

function drawBrow(c, x, y, dir, up){
  const yy = y - up * 14;
  c.save(); c.fillStyle = "#a8743a"; c.strokeStyle = "#a8743a"; c.lineWidth = 5; c.lineJoin = "round"; c.beginPath();
  c.moveTo(x - dir * 46, yy + 10); c.quadraticCurveTo(x, yy - 12, x + dir * 44, yy + 2);
  c.quadraticCurveTo(x, yy - 3, x - dir * 46, yy + 10); c.closePath(); c.stroke(); c.fill(); c.restore();
}

/* ====================== Mund: Formen (O, breit, Schmollmund, …) ====================== */
function drawMouth(c){
  const round = clamp(S.fun * 1.0 + S.puck * .9, 0, 1);
  const mx = 627 + S.side * 16, ym = 716;
  const wide = S.str * 16 + (S.sl + S.sr) / 2 * 10;
  const w = clamp(36 + wide - S.puck * 14 - S.fun * 16, 15, 62);
  let H = S.open * 56;
  H = Math.max(H, round * 32);
  const lift = 1 - round * .7;
  const yl = ym - S.sl * 10 * lift + S.frown * 7, yr = ym - S.sr * 10 * lift + S.frown * 7;
  const ymid = (yl + yr) / 2;
  const ht = H * .38 + S.up * 5, hb = H * .62 + S.low * 5;
  const k = .62 + round * .72;
  c.save(); c.lineCap = "round"; c.lineJoin = "round";
  if (H < 2.5) {
    const sag = 12 + (S.sl + S.sr) * 8 - S.frown * 14 - S.press * 10;
    c.strokeStyle = S.press > .4 ? "#6a2f28" : "#8a4a3a"; c.lineWidth = 4.5 + S.press * 1.5;
    c.beginPath(); c.moveTo(mx - w, yl - 2); c.quadraticCurveTo(mx, ymid + sag, mx + w, yr - 2); c.stroke();
  } else {
    const tc = ymid - ht * 1.333, bc = ymid + hb * 1.333 + 2;
    c.beginPath(); c.moveTo(mx - w, yl);
    c.bezierCurveTo(mx - w * k, tc, mx + w * k, tc, mx + w, yr);
    c.bezierCurveTo(mx + w * k, bc, mx - w * k, bc, mx - w, yl); c.closePath();
    const gi = c.createLinearGradient(0, ymid - ht, 0, ymid + hb); gi.addColorStop(0, "#2c0a12"); gi.addColorStop(1, "#5a1626");
    c.fillStyle = gi; c.fill();
    c.save(); c.clip();
    if (H > 14 && round < .55) { // obere Zähne
      c.fillStyle = "#fbfbff"; rr(c, mx - w * .82, ymid - ht - 6, w * 1.64, Math.min(13, H * .3) + 6, 5); c.fill();
    }
    const tr = 1 - round * .45; // Zunge
    c.fillStyle = "#e8707c"; c.beginPath(); c.ellipse(mx, ymid + hb * .85, w * .56 * tr, Math.max(3, hb * .5), 0, 0, 7); c.fill();
    c.fillStyle = "rgba(255,255,255,.18)"; c.beginPath(); c.ellipse(mx - w * .1, ymid + hb * .7, w * .2, Math.max(2, hb * .14), 0, 0, 7); c.fill();
    c.restore();
    c.strokeStyle = "#6a2a28"; c.lineWidth = 4.5; c.beginPath(); c.moveTo(mx - w, yl);
    c.bezierCurveTo(mx - w * k, tc, mx + w * k, tc, mx + w, yr); c.bezierCurveTo(mx + w * k, bc, mx - w * k, bc, mx - w, yl); c.closePath(); c.stroke();
    if (round > .35) { c.strokeStyle = "rgba(255,150,150,.35)"; c.lineWidth = 3; c.beginPath(); c.ellipse(mx, ymid + (hb - ht) / 2, w + 6, (ht + hb) / 2 + 6, 0, 0, 7); c.stroke(); }
  }
  c.restore();
}

/* ====================== Kopf ====================== */
function facePath(c, d){
  c.beginPath(); c.moveTo(452, 560); c.bezierCurveTo(450, 470, 520, 420, 627, 420); c.bezierCurveTo(735, 420, 802, 470, 800, 560);
  c.lineTo(800, 640); c.bezierCurveTo(800, 745 + d * .6, 740, 812 + d, 627, 814 + d); c.bezierCurveTo(515, 812 + d, 452, 745 + d * .6, 452, 640); c.closePath();
}

function drawHead(breath){
  ctx.save();
  ctx.translate(S.hx, S.hy + breath * 2.5);
  ctx.translate(627, 840); ctx.rotate(S.roll); ctx.translate(-627, -840);
  const L = (kx, ky, fn) => { ctx.save(); ctx.translate(S.yaw * kx, S.pitch * ky); fn(ctx); ctx.restore(); };
  const ya = Math.abs(S.yaw);
  const jaw = S.open * 15;

  L(90, 70, c => {
    c.lineCap = "round"; c.strokeStyle = "#0d0d11"; c.lineWidth = 44;
    c.beginPath(); c.moveTo(330, 610); c.bezierCurveTo(268, 300, 400, 160, 627, 156); c.bezierCurveTo(854, 160, 986, 300, 924, 610); c.stroke();
    c.strokeStyle = BLUE; c.lineWidth = 11; c.stroke();
  });

  L(80, 60, c => {
    c.fillStyle = "#e0b862"; c.strokeStyle = "rgba(120,82,28,.9)"; c.lineWidth = 3;
    for (const m of [1, -1]) {
      c.save(); if (m < 0) { c.translate(W, 0); c.scale(-1, 1); }
      c.beginPath(); c.moveTo(336, 440); c.lineTo(332, 560); c.lineTo(458, 612); c.lineTo(458, 470); c.closePath(); c.fill(); c.stroke(); c.restore();
    }
  });

  L(110, 90, c => {
    const g = c.createLinearGradient(0, 420, 0, 815); g.addColorStop(0, "#f5c692"); g.addColorStop(.6, "#f0b985"); g.addColorStop(1, "#e8aa74");
    facePath(c, jaw); c.fillStyle = g; c.fill();
    c.save(); facePath(c, jaw); c.clip();
    const fs = c.createLinearGradient(0, 430, 0, 545); fs.addColorStop(0, "rgba(150,85,40,.4)"); fs.addColorStop(1, "rgba(150,85,40,0)");
    c.fillStyle = fs; c.fillRect(440, 420, 370, 130);
    const sd = c.createLinearGradient(452, 0, 800, 0); sd.addColorStop(0, "rgba(160,90,50,.28)"); sd.addColorStop(.18, "rgba(160,90,50,0)"); sd.addColorStop(.82, "rgba(160,90,50,0)"); sd.addColorStop(1, "rgba(160,90,50,.28)");
    c.fillStyle = sd; c.fillRect(440, 420, 370, 420);
    c.restore();
    facePath(c, jaw); c.strokeStyle = "#b97c4c"; c.lineWidth = 2.5; c.stroke();
  });

  ctx.save(); ctx.translate(S.yaw * 170, S.pitch * 140); ctx.translate(627, 0); ctx.scale(1 - ya * .14, 1); ctx.translate(-627, 0);
  ctx.fillStyle = "rgba(240,130,115,.33)"; ctx.beginPath(); ctx.ellipse(497, 690, 38, 22, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(757, 690, 38, 22, 0, 0, 7); ctx.fill();
  drawEye(ctx, 518, 600, S.bl, S.gx, S.gy, -1);
  drawEye(ctx, 738, 600, S.br, S.gx, S.gy, 1);
  drawBrow(ctx, 505, 520, 1, S.brow); drawBrow(ctx, 749, 520, -1, S.brow);
  ctx.fillStyle = "#c98a5e"; ctx.beginPath(); ctx.arc(627, 661, 4.5, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,230,200,.7)"; ctx.beginPath(); ctx.arc(625.5, 659.5, 1.8, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(0, jaw * .55); drawMouth(ctx); ctx.restore();
  ctx.restore();

  L(100, 80, c => {
    drawCupLeft(c, 1 + S.yaw * .25);
    c.save(); c.translate(W, 0); c.scale(-1, 1); drawCupLeft(c, 1 - S.yaw * .25); c.restore();
  });

  L(130, 100, c => drawHairFront(c));
  ctx.restore();
}

/* ====================== Tracking ====================== */
let tracker = null, lastSeen = -1e9, calibNext = true, cal = { yaw:0, pitch:0, roll:0, x:.5, y:.5 };
const bmax = { l: .5, r: .5 };

$("start").addEventListener("click", async () => {
  $("start").disabled = true;
  try {
    statusEl.textContent = "Kamera wird gestartet…";
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" }, audio: false });
    video.srcObject = stream; await video.play();
    statusEl.textContent = "Lade Gesichtsmodell (einmalig, ca. 10 MB)…";
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const make = delegate => FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate },
      runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true
    });
    try { tracker = await make("GPU"); } catch (e) { tracker = await make("CPU"); }
    $("calib").disabled = false;
    statusEl.textContent = "Tracking läuft. Schau am Anfang neutral in die Kamera (wird automatisch kalibriert).";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Fehler: " + (err.message || err) + " (Kamera erlauben; Datei am besten über https oder localhost öffnen.)";
    $("start").disabled = false;
  }
});
$("calib").addEventListener("click", () => { calibNext = true; bmax.l = bmax.r = .5; });
$("showcam").addEventListener("change", e => video.style.display = e.target.checked ? "block" : "none");

// Lidschluss: passt sich an deinen persönlichen Maximalwert an, damit er wirklich ganz zugeht
function blinkNorm(s, key){
  bmax[key] = Math.max(.35, s, bmax[key] * .9995);
  let v = clamp((s - .1) / (bmax[key] * .78 - .1), 0, 1);
  if (v > .82) v = 1; else v = v / .82;
  return v * v * (3 - 2 * v);
}

function handle(res, now){
  if (!res.faceLandmarks || !res.faceLandmarks.length) return;
  lastSeen = now;
  const m = res.facialTransformationMatrixes[0].data;
  const nose = res.faceLandmarks[0][1];
  const raw = { yaw: Math.atan2(m[8], m[10]), pitch: Math.atan2(m[6], m[5]), roll: Math.atan2(m[1], m[0]), x: nose.x, y: nose.y };
  if (calibNext) { cal = { ...raw }; calibNext = false; }
  const mirrorOn = $("mirror").checked, mir = mirrorOn ? 1 : -1;
  const iy = $("invYaw").checked ? -1 : 1, ip = $("invPitch").checked ? -1 : 1, ir = $("invRoll").checked ? -1 : 1;
  T.yaw = clamp((raw.yaw - cal.yaw) * -mir * iy, -.8, .8);
  T.pitch = clamp((raw.pitch - cal.pitch) * ip, -.7, .7);
  T.roll = clamp((raw.roll - cal.roll) * mir * ir, -.6, .6);
  T.hx = clamp((raw.x - cal.x) * -mir * 700, -140, 140);
  T.hy = clamp((raw.y - cal.y) * 600, -90, 90);

  const b = {}; for (const c of res.faceBlendshapes[0].categories) b[c.categoryName] = c.score;
  const g = n => b[n] || 0;
  const swap = $("swapSides").checked;
  const leftIsSubj = mirrorOn !== swap;             // Bildschirm-links = linke Seite der Person?
  const pick = n => { const l = g(n + "Left"), r = g(n + "Right"); return leftIsSubj ? [l, r] : [r, l]; };

  const [blS, brS] = pick("eyeBlink");
  T.bl = blinkNorm(blS, "l"); T.br = blinkNorm(brS, "r");

  T.open = clamp((g("jawOpen") - .04) * 1.5, 0, 1);
  T.fun = clamp(g("mouthFunnel") * 1.3, 0, 1);
  T.puck = clamp(g("mouthPucker") * 1.3, 0, 1);
  const [slS, srS] = pick("mouthSmile"), [flS, frS] = pick("mouthFrown"), [stL, stR] = pick("mouthStretch"), [puL, puR] = pick("mouthPress"), [upL, upR] = pick("mouthUpperUp"), [loL, loR] = pick("mouthLowerDown");
  T.sl = clamp(slS * 1.6, 0, 1); T.sr = clamp(srS * 1.6, 0, 1);
  T.frown = clamp((flS + frS) * .9, 0, 1);
  T.str = clamp((stL + stR) * 1.2, 0, 1);
  T.press = clamp((puL + puR) * 1.2, 0, 1);
  T.up = clamp((upL + upR) * 1.2, 0, 1); T.low = clamp((loL + loR) * 1.2, 0, 1);
  T.side = clamp((leftIsSubj ? g("mouthRight") - g("mouthLeft") : g("mouthLeft") - g("mouthRight")) * 1.5, -1, 1);
  T.brow = clamp(g("browInnerUp") * 1.4 - (g("browDownLeft") + g("browDownRight")) * .7, -1, 1);

  const gxRaw = ((g("eyeLookInLeft") + g("eyeLookOutRight")) - (g("eyeLookOutLeft") + g("eyeLookInRight"))) / 2;
  T.gx = clamp(gxRaw * 1.6 * (swap ? -1 : 1) * (mirrorOn ? 1 : -1), -1, 1);
  T.gy = clamp(((g("eyeLookDownLeft") + g("eyeLookDownRight")) - (g("eyeLookUpLeft") + g("eyeLookUpRight"))) * 1.2, -1, 1);
}

/* ====================== Hauptschleife ====================== */
function resize(){
  const size = Math.max(200, Math.min(window.innerHeight - 120, window.innerWidth - 16));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = canvas.style.height = size + "px";
  canvas.width = canvas.height = Math.round(size * dpr);
}
addEventListener("resize", resize); resize();

let last = performance.now(), lastVT = -1;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  if (tracker && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    try { handle(tracker.detectForVideo(video, now), now); } catch (e) { console.warn(e); }
  }
  const tracked = now - lastSeen < 800;

  if (!tracked) {
    for (const k of ["open","fun","puck","frown","str","press","up","low","side","brow"]) T[k] = 0;
    T.sl = T.sr = .22;
    T.yaw = Math.sin(t * .45) * .07; T.pitch = Math.sin(t * .33 + 1) * .035; T.roll = Math.sin(t * .27) * .035;
    T.hx = Math.sin(t * .4) * 7; T.hy = Math.sin(t * .31) * 3;
    T.gx = Math.sin(t * .6) * .35; T.gy = Math.sin(t * .43) * .15;
    if (blinkT < 0 && t > nextBlink) blinkT = 0;
    if (blinkT >= 0) {
      blinkT += dt; const k = blinkT / .2; T.bl = T.br = k < .45 ? k / .45 : Math.max(0, 1 - (k - .45) / .55);
      if (k >= 1) { blinkT = -1; T.bl = T.br = 0; nextBlink = t + 2 + Math.random() * 3.5; }
    } else T.bl = T.br = 0;
  }

  const rates = { yaw:16, pitch:16, roll:16, hx:16, hy:16, bl:50, br:50, brow:14, gx:22, gy:22, open:32, fun:26, puck:26, sl:16, sr:16, frown:14, str:22, press:22, up:22, low:22, side:20 };
  for (const k of KEYS) S[k] = damp(S[k], T[k], rates[k], dt);

  const breath = Math.sin(t * 1.5) * .5 + .5;

  // Bewegungsgeschwindigkeit des Kopfs → Haar- und Kordelphysik
  const hv = dt > 0 ? ((S.hx - prev.hx) / dt + (S.yaw - prev.yaw) / dt * 220 + (S.roll - prev.roll) / dt * 170) : 0;
  const vv = dt > 0 ? ((S.hy - prev.hy) / dt + (S.pitch - prev.pitch) / dt * 200) : 0;
  prev = { hx: S.hx, hy: S.hy, yaw: S.yaw, pitch: S.pitch, roll: S.roll };
  const tx = clamp(-hv * .1, -34, 34), ty = clamp(-vv * .08, -26, 26);
  let sx = 0, sy = 0;
  for (const lk of LK) {
    const w = lk.a[6];
    const gx = tx * (.55 + .45 * w) + Math.sin(t * lk.f + lk.ph) * 3.2 * w + S.roll * -22 * w;
    const gy = ty * (.55 + .45 * w) + Math.cos(t * lk.f * 1.3 + lk.ph) * 2 * w + breath * 2 + S.pitch * 14;
    lk.vx += (lk.k * (gx - lk.x) - lk.c * lk.vx) * dt; lk.x += lk.vx * dt;
    lk.vy += (lk.k * (gy - lk.y) - lk.c * lk.vy) * dt; lk.y += lk.vy * dt;
    sx += lk.x; sy += lk.y;
  }
  hairAvg.x = sx / LK.length; hairAvg.y = sy / LK.length;
  str.vx += (90 * (clamp(-hv * .07, -16, 16) + Math.sin(t * 1.7) * 2.5 - str.x) - 5 * str.vx) * dt; str.x += str.vx * dt;

  const sc = canvas.width / W;
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.clearRect(0, 0, W, W);
  ctx.save();
  ctx.translate(W / 2, W / 2); ctx.scale(1.05, 1.05); ctx.translate(-W / 2 - S.hx * .12, -W / 2 - S.hy * .08);
  ctx.drawImage(bgC, 0, 0, W, W);
  ctx.restore();
  drawBody(breath);
  drawHead(breath);
}
requestAnimationFrame(frame);
</script>
</body>
