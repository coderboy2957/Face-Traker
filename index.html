<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flooderso – Webcam Tracking</title>
<style>
  html,body{margin:0;height:100%;background:#0a0b10;color:#cfd8ff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center;gap:8px}
  canvas{border-radius:12px;background:#111;box-shadow:0 0 40px #1d4ed855}
  #bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 8px;font-size:13px;align-items:center}
  button,label.btn{background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px}
  button:disabled{opacity:.5}
  #status{font-size:12px;opacity:.8;text-align:center;padding:0 10px}
  details{font-size:12px;text-align:center}
  #cam{position:fixed;right:10px;bottom:10px;width:150px;border-radius:8px;transform:scaleX(-1);opacity:.85;display:none}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;pointer-events:none;opacity:.0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="bar">
    <label class="btn">1. Bild laden<input id="file" type="file" accept="image/*" hidden></label>
    <button id="start">2. Kamera starten</button>
    <button id="calib" disabled>Kalibrieren</button>
    <label><input type="checkbox" id="mirror" checked> Spiegeln</label>
    <label><input type="checkbox" id="showcam"> Kamera-Vorschau</label>
  </div>
  <details>
    <summary>Achsen falsch herum? Hier invertieren</summary>
    <label><input type="checkbox" id="invYaw"> Links/Rechts</label>
    <label><input type="checkbox" id="invPitch"> Hoch/Runter</label>
    <label><input type="checkbox" id="invRoll"> Neigung</label>
  </details>
  <div id="status">Lade zuerst dein Bild (PNG), oder ziehe es per Drag &amp; Drop ins Fenster.</div>
</div>
<video id="cam" playsinline muted></video>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const canvas = $("gl"), statusEl = $("status"), video = $("cam");
const gl = canvas.getContext("webgl", { premultipliedAlpha: false, antialias: true });
if (!gl) statusEl.textContent = "WebGL wird von diesem Browser nicht unterstützt.";

/* ---------- Shader ---------- */
const VS = `
attribute vec2 aUv;
uniform vec3 uHead;      // yaw, pitch, roll (rad)
uniform vec2 uHeadOff;   // px
uniform vec2 uHair;      // px
uniform vec2 uStr;       // px
uniform vec2 uBg;        // px
uniform float uBreath, uShoulder, uShRoll, uLean, uBrow, uMouth, uZoom;
varying vec2 vUv;
void main(){
  vUv = aUv;
  vec2 p = aUv * 1254.0;
  vec2 q = p;

  // Körper / Atmen / Schultern
  float bodyW = smoothstep(790.0, 940.0, p.y);
  vec2 bc = vec2(627.0, 1254.0);
  q = bc + (q - bc) * (1.0 + 0.014 * uBreath * bodyW);
  float sideW = smoothstep(100.0, 330.0, abs(p.x - 627.0));
  q.y -= uShoulder * bodyW * (0.35 + 0.65 * sideW);
  q.y += uShRoll * ((p.x - 627.0) / 300.0) * bodyW;
  q.x += uLean * bodyW;

  // Kordeln des Hoodies
  float s1 = exp(-pow((p.x - 545.0) / 28.0, 2.0));
  float s2 = exp(-pow((p.x - 718.0) / 28.0, 2.0));
  float sw = max(s1, s2) * clamp((p.y - 950.0) / 260.0, 0.0, 1.0);
  q.x += uStr.x * sw;

  // Kopf
  float hd = length((p - vec2(627.0, 500.0)) / vec2(400.0, 360.0));
  float w = (1.0 - smoothstep(0.9, 1.5, hd)) * (1.0 - smoothstep(790.0, 910.0, p.y));
  float face = 1.0 - smoothstep(0.7, 1.15, length((p - vec2(627.0, 610.0)) / vec2(290.0, 320.0)));
  vec2 pivot = vec2(627.0, 840.0);
  float a = uHead.z * w;
  float cs = cos(a), sn = sin(a);
  vec2 r = q - pivot;
  r = vec2(cs * r.x - sn * r.y, sn * r.x + cs * r.y);
  q = pivot + r;
  q += w * (vec2(uHead.x * (120.0 + 170.0 * face), uHead.y * (90.0 + 130.0 * face)) + uHeadOff);

  // Kiefer
  q.y += uMouth * 9.0 * face * smoothstep(700.0, 740.0, p.y) * (1.0 - smoothstep(770.0, 820.0, p.y));

  // Augenbrauen
  float bx = smoothstep(40.0, 90.0, abs(p.x - 627.0)) * (1.0 - smoothstep(230.0, 300.0, abs(p.x - 627.0)));
  float browW = exp(-pow((p.y - 520.0) / 22.0, 2.0)) * bx;
  q.y -= uBrow * 11.0 * browW * w;

  // Haare (Nachschwingen)
  float hw = w * (1.0 - smoothstep(220.0, 560.0, p.y)) * (0.35 + 0.65 * (1.0 - face));
  q += uHair * hw;

  // leichte Hintergrund-Parallaxe
  q += uBg * (1.0 - w);

  vec2 n = (q / 1254.0 * 2.0 - 1.0) * uZoom;
  gl_Position = vec4(n.x, -n.y, 0.0, 1.0);
}`;

const FS = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uBlink;   // links, rechts (Bildschirm)
uniform vec2 uGaze;
uniform float uMouth, uSmile;
uniform vec3 uSkin;
const vec2 EL = vec2(518.0, 600.0);
const vec2 ER = vec2(738.0, 600.0);
const vec2 ERAD = vec2(72.0, 62.0);

vec3 lid(vec3 col, vec2 p, vec2 c, float cl){
  if (cl < 0.02) return col;
  vec2 d = (p - c) / ERAD;
  float e = length(d);
  float inside = 1.0 - smoothstep(0.88, 1.0, e);
  float lidY = c.y - ERAD.y * 0.95 + cl * ERAD.y * 1.55 + d.x * d.x * 10.0 * cl;
  float cover = inside * (1.0 - smoothstep(lidY - 1.5, lidY + 1.5, p.y));
  col = mix(col, uSkin, cover);
  float line = inside * (1.0 - smoothstep(1.5, 4.5, abs(p.y - lidY))) * smoothstep(0.1, 0.35, cl);
  return mix(col, vec3(0.16, 0.09, 0.12), line * 0.95);
}

void main(){
  vec2 p = vUv * 1254.0;
  vec2 sp = p;
  float ml = 1.0 - smoothstep(0.5, 0.95, length((p - EL) / ERAD));
  float mr = 1.0 - smoothstep(0.5, 0.95, length((p - ER) / ERAD));
  sp -= uGaze * 8.0 * (ml + mr);
  vec4 t = texture2D(uTex, sp / 1254.0);
  vec3 col = t.rgb;
  col = lid(col, p, EL, uBlink.x);
  col = lid(col, p, ER, uBlink.y);

  if (uMouth > 0.05) {
    float k = smoothstep(0.05, 0.15, uMouth);
    float ry = uMouth * 30.0;
    float rx = 40.0 + uSmile * 10.0;
    vec2 d = (p - (vec2(627.0, 718.0) + vec2(0.0, ry * 0.6))) / vec2(rx, max(ry, 1.0));
    float e = length(d);
    float inM = (1.0 - smoothstep(0.92, 1.0, e)) * k;
    vec3 inner = mix(vec3(0.28, 0.06, 0.09), vec3(0.82, 0.32, 0.38), smoothstep(0.1, 0.9, d.y));
    col = mix(col, inner, inM);
    float ring = (1.0 - smoothstep(0.0, 0.12, abs(e - 1.0))) * k;
    col = mix(col, vec3(0.2, 0.08, 0.1), ring * 0.8);
  }
  gl_FragColor = vec4(col, t.a);
}`;

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

// Gitter-Mesh
const N = 64, verts = [], idx = [];
for (let y = 0; y <= N; y++) for (let x = 0; x <= N; x++) verts.push(x / N, y / N);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const i = y * (N + 1) + x;
  idx.push(i, i + 1, i + N + 1, i + 1, i + N + 2, i + N + 1);
}
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
const aUv = gl.getAttribLocation(prog, "aUv");
gl.enableVertexAttribArray(aUv); gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 0, 0);

const U = {};
["uHead","uHeadOff","uHair","uStr","uBg","uBreath","uShoulder","uShRoll","uLean","uBrow","uMouth","uZoom",
 "uBlink","uGaze","uSmile","uSkin","uTex"].forEach(n => U[n] = gl.getUniformLocation(prog, n));

const tex = gl.createTexture();
let imgLoaded = false;

function loadImage(src){
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    const pot = (img.width & (img.width - 1)) === 0 && (img.height & (img.height - 1)) === 0;
    if (pot) { gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); }
    else gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    // Hautfarbe aus dem Bild abtasten
    const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
    const cx = c.getContext("2d"); cx.drawImage(img, 0, 0);
    const sx = Math.round(560 / 1254 * img.width), sy = Math.round(676 / 1254 * img.height);
    const d = cx.getImageData(sx - 4, sy - 4, 9, 9).data;
    let r = 0, g = 0, b = 0; for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
    const n = d.length / 4; skin = [r / n / 255, g / n / 255, b / n / 255];

    imgLoaded = true;
    resize(img.width / img.height);
    if (!tracker) statusEl.textContent = "Bild geladen. Jetzt „Kamera starten“ klicken.";
  };
  img.src = src;
}
let skin = [0.93, 0.72, 0.5];

function resize(aspect = 1){
  const maxH = window.innerHeight - 110, maxW = window.innerWidth - 16;
  let h = Math.min(maxH, maxW / aspect), w = h * aspect;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
let aspectNow = 1;
window.addEventListener("resize", () => resize(canvas.width / canvas.height));

$("file").addEventListener("change", e => { const f = e.target.files[0]; if (f) loadImage(URL.createObjectURL(f)); });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith("image/")) loadImage(URL.createObjectURL(f)); });
$("showcam").addEventListener("change", e => video.style.display = e.target.checked ? "block" : "none");

/* ---------- Tracking ---------- */
let tracker = null, lastSeen = -1e9, calibNext = true, cal = { yaw:0, pitch:0, roll:0, x:0.5, y:0.5 }, raw = null;

$("start").addEventListener("click", async () => {
  $("start").disabled = true;
  try {
    statusEl.textContent = "Kamera wird gestartet…";
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" }, audio: false });
    video.srcObject = stream; await video.play();
    statusEl.textContent = "Lade Gesichtsmodell (einmalig, ~10 MB)…";
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const make = delegate => FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate },
      runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true
    });
    try { tracker = await make("GPU"); } catch (e) { tracker = await make("CPU"); }
    $("calib").disabled = false;
    statusEl.textContent = "Tracking läuft. Schau neutral in die Kamera – das wird automatisch kalibriert. Mit „Kalibrieren“ kannst du neu zentrieren.";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Fehler: " + (err.message || err) + " (Kamera erlaubt? Seite per https oder localhost öffnen.)";
    $("start").disabled = false;
  }
});
$("calib").addEventListener("click", () => { calibNext = true; });

/* ---------- Zustand ---------- */
const T = { yaw:0, pitch:0, roll:0, hx:0, hy:0, bl:0, br:0, mouth:0, smile:0, brow:0, gx:0, gy:0 };
const S = { yaw:0, pitch:0, roll:0, hx:0, hy:0, bl:0, br:0, mouth:0, smile:0, brow:0, gx:0, gy:0 };
const hair = { x:0, vx:0, y:0, vy:0 }, str = { x:0, vx:0 };
let prev = { hx:0, yaw:0, roll:0 };
let nextBlink = 2, blinkT = -1;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (cur, tgt, rate, dt) => cur + (tgt - cur) * (1 - Math.exp(-rate * dt));

function handle(res, now){
  if (!res.faceLandmarks || !res.faceLandmarks.length) return;
  lastSeen = now;
  const m = res.facialTransformationMatrixes[0].data;
  const lm = res.faceLandmarks[0][1]; // Nasenspitze
  raw = { yaw: Math.atan2(m[8], m[10]), pitch: Math.atan2(m[6], m[5]), roll: Math.atan2(m[1], m[0]), x: lm.x, y: lm.y };
  if (calibNext) { cal = { ...raw }; calibNext = false; }

  const mir = $("mirror").checked ? 1 : -1;
  const iy = $("invYaw").checked ? -1 : 1, ip = $("invPitch").checked ? -1 : 1, ir = $("invRoll").checked ? -1 : 1;
  T.yaw   = clamp((raw.yaw - cal.yaw) * -mir * iy, -0.8, 0.8);
  T.pitch = clamp((raw.pitch - cal.pitch) * ip, -0.7, 0.7);
  T.roll  = clamp((raw.roll - cal.roll) * mir * ir, -0.6, 0.6);
  T.hx = clamp((raw.x - cal.x) * -mir * 700, -140, 140);
  T.hy = clamp((raw.y - cal.y) * 600, -90, 90);

  const b = {}; for (const c of res.faceBlendshapes[0].categories) b[c.categoryName] = c.score;
  const eyeClose = s => clamp((s - 0.15) / 0.5, 0, 1);
  // Spiegel: Bild-links = rechtes Auge der Person
  const eR = eyeClose(b.eyeBlinkRight || 0), eL = eyeClose(b.eyeBlinkLeft || 0);
  if ($("mirror").checked) { T.bl = eR; T.br = eL; } else { T.bl = eL; T.br = eR; }
  T.mouth = clamp(((b.jawOpen || 0) - 0.05) * 1.8, 0, 1);
  T.smile = clamp(((b.mouthSmileLeft || 0) + (b.mouthSmileRight || 0)) - (b.mouthPucker || 0) * 1.5, -1, 1);
  T.brow = clamp((b.browInnerUp || 0) * 1.4 - ((b.browDownLeft || 0) + (b.browDownRight || 0)) * 0.7, -1, 1);
  const inL = b.eyeLookInLeft || 0, outL = b.eyeLookOutLeft || 0, inR = b.eyeLookInRight || 0, outR = b.eyeLookOutRight || 0;
  const gxRaw = ((inL + outR) - (outL + inR)) / 2; // + = Person schaut nach rechts
  T.gx = clamp(gxRaw * 1.6 * ($("mirror").checked ? 1 : -1), -1, 1);
  T.gy = clamp((((b.eyeLookDownLeft||0) + (b.eyeLookDownRight||0)) - ((b.eyeLookUpLeft||0) + (b.eyeLookUpRight||0))) * 1.2, -1, 1);
}

let last = performance.now(), lastVT = -1;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  if (tracker && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    try { handle(tracker.detectForVideo(video, now), now); } catch (e) { console.warn(e); }
  }
  const tracked = now - lastSeen < 800;

  if (!tracked) { // Idle-Animation
    T.yaw = Math.sin(t * 0.45) * 0.06; T.pitch = Math.sin(t * 0.33 + 1) * 0.03; T.roll = Math.sin(t * 0.27) * 0.03;
    T.hx = Math.sin(t * 0.4) * 6; T.hy = 0; T.mouth = 0; T.smile = 0; T.brow = 0; T.gx = Math.sin(t * 0.6) * 0.3; T.gy = 0;
    if (blinkT < 0 && t > nextBlink) { blinkT = 0; }
    if (blinkT >= 0) { blinkT += dt; const k = blinkT / 0.18; T.bl = T.br = k < 0.5 ? k * 2 : Math.max(0, 2 - k * 2); if (k >= 1) { blinkT = -1; T.bl = T.br = 0; nextBlink = t + 2 + Math.random() * 3.5; } }
    else T.bl = T.br = 0;
  }

  const rp = 16;
  S.yaw = damp(S.yaw, T.yaw, rp, dt); S.pitch = damp(S.pitch, T.pitch, rp, dt); S.roll = damp(S.roll, T.roll, rp, dt);
  S.hx = damp(S.hx, T.hx, rp, dt); S.hy = damp(S.hy, T.hy, rp, dt);
  S.bl = damp(S.bl, T.bl, 45, dt); S.br = damp(S.br, T.br, 45, dt);
  S.mouth = damp(S.mouth, T.mouth, 30, dt); S.smile = damp(S.smile, T.smile, 12, dt);
  S.brow = damp(S.brow, T.brow, 14, dt); S.gx = damp(S.gx, T.gx, 20, dt); S.gy = damp(S.gy, T.gy, 20, dt);

  // Atmen
  const breath = Math.sin(t * 1.5) * 0.5 + 0.5;

  // Federn für Haare und Kordeln
  const hv = dt > 0 ? ((S.hx - prev.hx) / dt + (S.yaw - prev.yaw) / dt * 200 + (S.roll - prev.roll) / dt * 150) : 0;
  prev = { hx: S.hx, yaw: S.yaw, roll: S.roll };
  const spring = (o, key, vkey, target, k, c) => { o[vkey] += (k * (target - o[key]) - c * o[vkey]) * dt; o[key] += o[vkey] * dt; };
  const tx = clamp(-hv * 0.05, -16, 16) + Math.sin(t * 1.1) * 1.2;
  spring(hair, "x", "vx", tx, 140, 9);
  spring(hair, "y", "vy", clamp(-Math.abs(hv) * 0.02, -8, 0) + breath * 1.5, 120, 8);
  spring(str, "x", "vx", clamp(-hv * 0.06, -14, 14) + Math.sin(t * 1.7) * 2.5, 90, 5);

  if (imgLoaded) {
    gl.clearColor(0.04, 0.04, 0.06, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(U.uTex, 0);
    gl.uniform3f(U.uHead, S.yaw, S.pitch, S.roll);
    gl.uniform2f(U.uHeadOff, S.hx, S.hy + breath * 2.5);
    gl.uniform2f(U.uHair, hair.x, hair.y);
    gl.uniform2f(U.uStr, str.x, 0);
    gl.uniform2f(U.uBg, -S.hx * 0.12, -S.hy * 0.08);
    gl.uniform1f(U.uBreath, breath);
    gl.uniform1f(U.uShoulder, breath * 4 - S.hy * 0.25);
    gl.uniform1f(U.uShRoll, S.roll * 45);
    gl.uniform1f(U.uLean, S.hx * 0.35);
    gl.uniform1f(U.uBrow, S.brow);
    gl.uniform1f(U.uMouth, S.mouth);
    gl.uniform1f(U.uZoom, 1.06);
    gl.uniform2f(U.uBlink, S.bl, S.br);
    gl.uniform2f(U.uGaze, S.gx, S.gy);
    gl.uniform1f(U.uSmile, S.smile);
    gl.uniform3f(U.uSkin, skin[0], skin[1], skin[2]);
    gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
  }
}
resize(1);
requestAnimationFrame(frame);
</script>
</body>
</html>
